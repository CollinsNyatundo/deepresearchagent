# Deep Research Agent Configuration
# Copy this file to config.toml and fill in your API keys.

[llm]
default_model = "nvidia/nemotron-3-super-120b-a12b:free"
base_url = "https://openrouter.ai/api/v1"
temperature = 0.2
max_tokens = 16384

# Model presets shown in the frontend dropdown
[llm.presets]
nemotron = "nvidia/nemotron-3-super-120b-a12b:free"
gpt_oss = "openai/gpt-oss-120b:free"
qwen = "qwen/qwen3-235b-a22b:free"

[search]
default_provider = "duckduckgo"      # duckduckgo | tavily | brave
max_results = 10

# API keys — also settable via env vars TAVILY_API_KEY, BRAVE_SEARCH_API_KEY
# tavily_api_key = ""
# brave_api_key = ""

[scraping]
max_concurrent = 5
timeout_ms = 30000
max_content_chars = 20000            # Per-page content truncation limit
fetcher_tier = "stealthy"            # stealthy | dynamic | basic

[research]
default_depth = 5                     # 1=quick, 3=standard, 5=exhaustive
max_cycles = 30
progress_threshold = 90
max_pages_per_query = 5
enable_crossover = true
crossover_candidates = 3
progress_check_interval = 5

[api]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:5173"]
