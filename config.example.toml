# Deep Research Agent Configuration
# Copy this file to config.toml and fill in your API keys.

# ─── REQUIRED: Supabase ─────────────────────────────────────────────────────
# Set these environment variables before starting the server:
#
#   SUPABASE_URL  = https://your-project-ref.supabase.co
#   SUPABASE_KEY  = <service_role secret key>   ← MUST be service_role, NOT anon!
#
# ⚠️  CRITICAL: Use the SERVICE_ROLE key, not the ANON key.
#     The anon key triggers Row-Level Security (RLS) which blocks all backend
#     queries (workspace_members, notes, documents) with auth.uid() = NULL.
#     This causes 403/500 errors on every page after login.
#
#     Where to find the service_role key:
#       Supabase Dashboard → Your Project → Settings → API → service_role (secret)
#
# These are NOT in this file because they're secrets. Set them in your shell:
#   $env:SUPABASE_URL = "https://your-project.supabase.co"
#   $env:SUPABASE_KEY = "eyJ..."  # service_role key
#
# Or create a .env file (never commit it) and load it before starting.
# ─────────────────────────────────────────────────────────────────────────────

[llm]
# LLM provider: "openrouter" (default) or "groq"
# Can also be set via env var: LLM_PROVIDER=groq
provider = "openrouter"

default_model = "nvidia/nemotron-3-super-120b-a12b:free"
base_url = "https://openrouter.ai/api/v1"
temperature = 0.2
max_tokens = 16384

# Model presets shown in the frontend dropdown
[llm.presets]
nemotron = "nvidia/nemotron-3-super-120b-a12b:free"
gpt_oss = "openai/gpt-oss-120b:free"
qwen = "qwen/qwen3-235b-a22b:free"
# Groq models — use these when provider = "groq"
# groq_llama = "llama-3.3-70b-versatile"       # Best for reasoning/agentic tasks
# groq_llama_fast = "llama-3.1-8b-instant"     # Fastest, good for simple tasks
# groq_deepseek = "deepseek-r1-distill-llama-70b"  # Reasoning specialist

[search]
default_provider = "duckduckgo"      # duckduckgo | tavily | brave
max_results = 10

# API keys — also settable via env vars TAVILY_API_KEY, BRAVE_SEARCH_API_KEY
# tavily_api_key = ""
# brave_api_key = ""

[scraping]
max_concurrent = 5
timeout_ms = 30000
max_content_chars = 20000            # Per-page content truncation limit
fetcher_tier = "stealthy"            # stealthy | dynamic | basic

[research]
default_depth = 5                     # 1=quick, 3=standard, 5=exhaustive
max_cycles = 30
progress_threshold = 90
max_pages_per_query = 5
enable_crossover = true
crossover_candidates = 3
progress_check_interval = 5

[api]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:5173"]

[graphify]
# Master switch — set to false to disable all knowledge graph features
enabled = true

# Extraction mode:
# "fast" — AST-only, deterministic, low cost, minutes to build
# "deep" — AST + LLM-inferred semantic edges, hours on large corpora
mode = "deep"

# Strategy B: Start Graphify MCP server after building the graph
# so you can query the graph interactively from the UI
mcp_enabled = true
mcp_port = 8765

# Strategy C: max ArXiv/PDF URLs to enrich per run
# Set to 0 for unlimited (may be slow)
max_paper_enrichments = 5

