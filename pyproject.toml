[project]
name = "deep-research-agent"
version = "0.2.0"
description = "A general-purpose deep research engine with mindmap visualization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "scrapling>=0.2.9",
    "duckduckgo-search>=7.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiofiles>=24.0",
    # Export
    "fpdf2>=2.7",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "markdown>=3.7",
]

[project.optional-dependencies]
browser = [
    "camoufox>=0.4",
    "playwright>=1.49",
]
tavily = ["langchain-tavily>=0.1"]
brave = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
research = "research_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
