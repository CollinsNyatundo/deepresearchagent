[project]
name = "deep-research-agent"
version = "0.2.0"
description = "Autonomous deep research engine with SSE streaming, mindmap visualization, knowledge graph extraction, multi-provider LLM/search, and GitHub code research mode"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "scrapling>=0.2.9",
    # Scrapling transitive deps (not always pulled automatically)
    "curl-cffi>=0.7",
    "playwright>=1.49",
    "browserforge>=1.2",
    "tldextract>=5.0",
    "ddgs>=7.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiofiles>=24.0",
    # Export
    "fpdf2>=2.7",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "markdown>=3.7",
    "mcp>=1.0.0",
    "graphifyy>=0.4.0",
    "curl-cffi>=0.15.0",
    "playwright>=1.58.0",
    "browserforge>=1.2.4",
    "tldextract>=5.3.1",
    # Scrapling tiered fetchers — all required for full anti-bot stack
    "msgspec>=0.18",        # Required: DynamicFetcher (Playwright JS rendering)
    "patchright>=1.49",     # Required: StealthyFetcher stealth Chromium
    "camoufox>=0.4",        # Required: Camoufox Firefox (maximum fingerprint spoofing)
                            # After install: python -m camoufox fetch
    # GitNexus bridge integration
    "aiohttp>=3.9",         # Async HTTP client for GitNexus eval-server API
    # NOTE: apscheduler removed — scheduler uses pure asyncio (no extra deps)
    # Supabase Auth
    "pyjwt>=2.10",
    "cryptography>=46.0",
    "supabase>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # For FastAPI TestClient
    "ruff>=0.8",
]

[project.scripts]
research = "research_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests that make real network calls (deselect with -m 'not live')",
]
